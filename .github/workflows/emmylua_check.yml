name: EmmyLua Check

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  emmylua-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Submodule git dirs are cached per set of pinned commits. On a miss the closest
      # older cache is restored, and `submodule update` fetches only the bumped ones
      # and always checks out the exact pinned SHA, so stale sources are never used
      - name: Hash submodule commits
        id: submodules
        run: echo "hash=$(git submodule status | awk '{print $1, $2}' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache submodules
        uses: actions/cache@v6
        with:
          path: .git/modules
          key: submodules-${{ steps.submodules.outputs.hash }}
          restore-keys: submodules-

      - name: Init submodules
        run: git submodule update --init --depth=1

      - name: Resolve latest emmylua_check version
        id: emmylua
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh release view --repo EmmyLuaLs/emmylua-analyzer-rust --json tagName --jq .tagName)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Cache key is the latest release, so a new release triggers exactly one rebuild
      - name: Cache emmylua_check
        id: emmylua_cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/emmylua_check
          key: ${{ runner.os }}-emmylua_check-${{ steps.emmylua.outputs.version }}

      - name: Install emmylua_check
        if: steps.emmylua_cache.outputs.cache-hit != 'true'
        run: cargo install emmylua_check --version ${{ steps.emmylua.outputs.version }}

      - name: Run EmmyLua Check (Errors only)
        shell: bash
        run: |
          set -o pipefail
          #
          # Use `script` to emulate TTY and preserve colors
          script -q -e -c "emmylua_check ." /dev/null | awk '
            /^(\033\[[0-9;]*m)*[Ee][Rr][Rr][Oo][Rr]/ { p=1 }
            /^(\033\[[0-9;]*m)*(warning|hint|info)/ { p=0 }
            /^(\033\[[0-9;]*m)*Summary/ { p=1 }
            p
          '
