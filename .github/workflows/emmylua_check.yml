name: EmmyLua Check

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  emmylua-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Init Submodules
        uses: ./.github/actions/init-submodules-cached

      - name: Resolve latest emmylua_check version
        id: emmylua
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh release view --repo EmmyLuaLs/emmylua-analyzer-rust --json tagName --jq .tagName)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Cache key is the latest release, so a new release triggers exactly one rebuild
      - name: Cache emmylua_check
        id: emmylua_cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/emmylua_check
          key: ${{ runner.os }}-emmylua_check-${{ steps.emmylua.outputs.version }}

      - name: Install emmylua_check
        if: steps.emmylua_cache.outputs.cache-hit != 'true'
        run: cargo install emmylua_check --version ${{ steps.emmylua.outputs.version }}

      - name: Run EmmyLua Check (Errors only)
        shell: bash
        run: |
          set -o pipefail
          emmylua_check . --severity error --output-format github
